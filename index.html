<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e19"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Agent Local"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Agent Local</title>
<style>
:root{font-family:-apple-system,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080e19;color:#d9f9f1}main{max-width:720px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;padding:18px 0}h1{font-size:18px;letter-spacing:.16em;margin:0}small,.hint{color:#83b7ac}.tag{font-size:11px;border:1px solid #287a70;border-radius:20px;padding:8px}.face{position:relative;height:210px;border:1px solid #214f51;border-radius:22px;display:grid;place-items:center;background:radial-gradient(ellipse,#103339,#09141f 70%);overflow:hidden}.face:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 95%,#235d5638 96%),linear-gradient(transparent 95%,#235d5638 96%);background-size:22px 22px}.core{width:116px;height:116px;border:2px solid #67ffcf;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 30px #36dcb67a;animation:pulse 3s infinite}.core:after{content:"◈";font-size:70px;color:#a1ffe0}@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 55px #36dcb6a0}}.status{position:absolute;bottom:12px;font-size:12px;letter-spacing:.1em}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.hint{font-size:12px;line-height:1.5}.chat{flex:1;overflow:auto;min-height:150px;max-height:43dvh}.msg{padding:12px 14px;margin:10px 0;max-width:92%;border-radius:14px;white-space:pre-wrap;line-height:1.45;font-size:14px}.agent{background:#152b36;border:1px solid #23535c}.user{background:#14483f;margin-left:auto}.composer{display:flex;gap:8px;padding:12px 0 18px}input{flex:1;min-width:0;border:1px solid #28645e;background:#101e2b;color:white;padding:14px;border-radius:12px;font-size:16px}button{border:0;border-radius:12px;background:#3ad9aa;color:#04261e;font-weight:700;padding:12px;font-size:14px}button.secondary{background:#193c3c;color:#9aebd1}
</style></head><body><main><header><div><h1>AGENT LOCAL</h1><small>iPhone · offline-first</small></div><span class="tag" id="net">LOKAL</span></header><section class="face"><div class="core"></div><div class="status" id="status">REDO</div></section><div class="tools"><button class="secondary" id="voice">🔊 Röst på</button><button class="secondary" id="export">Exportera minne</button><button class="secondary" id="clear">Rensa chatt</button></div><p class="hint">Offline-prototyp utan språkmodell. Prova ”hjälp”, ”kom ihåg att …”, ”vad minns du?” eller ”tid”. Dina meddelanden sparas på enheten.</p><section class="chat" id="chat" aria-live="polite"></section><form class="composer" id="form"><input id="message" autocomplete="off" placeholder="Skriv till agenten…" aria-label="Meddelande"><button>Skicka</button></form></main>
<script>
const $=id=>document.getElementById(id),key='agent-local-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{messages:[],memories:[]}}catch{data={messages:[],memories:[]}}let speaking=true;
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{alert('Lagring blockerad eller full. Exportera minnet.')}}
function render(){const c=$('chat');c.replaceChildren();for(const m of data.messages){const el=document.createElement('div');el.className='msg '+m.role;el.textContent=m.text;c.append(el)}c.scrollTop=c.scrollHeight}
function add(role,text){data.messages.push({role,text,date:new Date().toISOString()});save();render()}
function say(t){if(!speaking||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sv-SE';speechSynthesis.speak(u)}catch{}}
function answer(t){const q=t.trim(),l=q.toLocaleLowerCase('sv');if(/^kom ihåg (att )?/i.test(q)){const m=q.replace(/^kom ihåg (att )?/i,'').trim();if(!m)return 'Vad ska jag komma ihåg?';data.memories.push({text:m,date:new Date().toISOString()});save();return 'Sparat lokalt: '+m}if(/minns du|visa minne|mina minnen/.test(l))return data.memories.length?'Jag minns:\n'+data.memories.map((m,i)=>(i+1)+'. '+m.text).join('\n'):'Inga sparade minnen ännu.';if(/^(tid|vad är klockan|datum)/.test(l))return 'Lokal tid: '+new Date().toLocaleString('sv-SE');if(/hjälp|vad kan du/.test(l))return 'Jag kan spara minnen med ”kom ihåg att …”, visa dem med ”vad minns du?”, visa tid, exportera minne och läsa upp svar. Jag har ännu ingen AI-språkmodell.';if(/hej|hallå/.test(l))return 'Hej! Jag kör lokalt på din iPhone. Skriv ”hjälp” för att börja.';return 'Meddelandet har sparats lokalt. Fri AI-chatt kräver en lokal språkmodell som inte ingår ännu.'}
$('form').addEventListener('submit',e=>{e.preventDefault();const t=$('message').value.trim();if(!t)return;$('message').value='';add('user',t);$('status').textContent='BEARBETAR LOKALT';const r=answer(t);add('agent',r);say(r);$('status').textContent='REDO'});
$('voice').onclick=()=>{speaking=!speaking;$('voice').textContent=speaking?'🔊 Röst på':'🔇 Röst av';if(!speaking&&'speechSynthesis'in window)speechSynthesis.cancel()};
$('clear').onclick=()=>{if(confirm('Rensa chatten? Minnen behålls.')){data.messages=[];save();render()}};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='agent-local-minne.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
function net(){$('net').textContent=navigator.onLine?'ONLINE / LOKAL':'OFFLINE'}addEventListener('online',net);addEventListener('offline',net);net();render();if(!data.messages.length)add('agent','Välkommen! Jag är en lokal agentprototyp. Skriv ”hjälp”.');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
